    @inproceedings{galbraith2026similarity-based,
      title={Similarity-Based Load-Balancing for Distributed Genomic Indices},
      author={Galbraith, Woodward and Mammadov, Ilgar and Pathak, Shreyaan and Gyori, Benjamin M. and Pandey, Prashant},
      booktitle={VLDB 2026 Workshop: Biomedical Data Management Systems (BioDMS)},
      year={2026},
      publisher={VLDB Endowment}
    }
  title: 'Similarity-Based Load-Balancing for Distributed Genomic Indices'
  authors:
  - Woodward Galbraith
  - Ilgar Mammadov
  - Shreyaan Pathak
  - Benjamin M. Gyori
  - Prashant Pandey
  abstract: |
    Publicly accessible large-scale sequencing data repositories are expanding rapidly. For example, the NIH Sequence Read Archive (SRA) alone now holds over 50 petabases of data and grows 16\% larger every year. Enabling efficient search over these vast datasets is key to advancing biological discovery. Recent work has introduced updatable, distributed search indices over unassembled sequencing experiments at petabase scale. However, current methods do not consider sequence similarity when distributing new experiments to nodes, leading to redundant storage and inflated index sizes, a bottleneck for keeping up with ever-expanding modern genomic repositories. To address this, we propose a similarity-based load-balancing strategy, which can be applied to any updatable distributed genomic search index, and implement a system using genomic sketching methods to distribute files across nodes. Our initial results, evaluated on a 2000-experiment subset of the Breast, Blood, and Brain dataset from SRA, demonstrate that similarity-based load-balancing reduces aggregate k-mer count by ~ 8.6\%, worker k-mer variance by ~61\%, and color class table sizes by ~4.7\% and further, that these compactness gains scale with both number of experiments and worker count, compared to naive routing methods, indicating this is a viable path towards more compact and better load-balanced distributed genomic search indices.
