    @inproceedings{aster2026the,
      title={The Genomic Variant Store: Decoupling Cloud-Native Storage from Analysis to Power Population-Scale Genomic Services},
      author={Aster, M. Morgan and Balaconis, M. Kate and Bemis, Matt and Covarrubias, Miguel and Hatcher, Aaron and Kachulis, Christopher and Labrecque, Sofia and Shah, Saloni P. and Lichtenstein, Lee},
      booktitle={VLDB 2026 Workshop: Biomedical Data Management Systems (BioDMS)},
      year={2026},
      publisher={VLDB Endowment}
    }
  title: 'The Genomic Variant Store: Decoupling Cloud-Native Storage from Analysis to Power Population-Scale Genomic Services'
  authors:
  - M. Morgan Aster
  - M. Kate Balaconis
  - Matt Bemis
  - Miguel Covarrubias
  - Aaron Hatcher
  - Christopher Kachulis
  - Sofia Labrecque
  - Saloni P. Shah
  - Lee Lichtenstein
  abstract: |
    Joint variant calling at biobank scale introduces two compounding infrastructure challenges: storing hundreds of thousands of genomes efficiently, and avoiding full reprocessing when new samples arrive. The Genomic Variant Store (GVS) addresses both by reframing joint calling as a cloud-native data management problem. Built on Google BigQuery, GVS uses a sparse alt-allele representation that scales linearly with cohort size and supports incremental ingestion, eliminating the need to reprocess existing samples. Deployed across 535,662 whole-genome sequencing samples in the All of Us CDR v9, GVS achieves a cost of USD$0.035 per sample -- roughly half the cost of the prior release -- by ingesting only new samples rather than the full cohort. By decoupling storage from analysis formats, GVS functions as a shared foundation for downstream data products. For example, the *All of Us* Cohort Builder, which enables sub-minute genotypic queries across 1.3 billion variant sites, and the *All of Us* + AnVIL Imputation Service which leverages GVS extractions to power the world's largest and most diverse genomic imputation reference panel. Together, these examples demonstrate that a well-designed variant storage layer is foundational infrastructure for population-scale biomedical discovery.
  year: 2026
