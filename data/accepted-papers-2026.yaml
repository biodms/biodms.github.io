    @inproceedings{nguyen2026medsqlx,
      title={MedSQLX: Translation of Medical Queries into UDF-Centric SQL},
      author={Nguyen, Catlynh and Bin Riaz, Irbaz and Baral, Chitta and Zou, Jia},
      booktitle={VLDB 2026 Workshop: Biomedical Data Management Systems (BioDMS)},
      year={2026},
      publisher={VLDB Endowment}
    }
  title: 'MedSQLX: Translation of Medical Queries into UDF-Centric SQL'
  authors:
  - Catlynh Nguyen
  - Irbaz Bin Riaz
  - Chitta Baral
  - Jia Zou
  abstract: |
    NL-to-SQL systems have matured considerably for standard SQL generation, yet they largely overlook user-defined functions (UDFs), which are custom higher-order logic, such as clinical rules, scoring formulas, and domain-specific classifications.

    This paper presents an agentic framework for generating UDF-centric queries from natural language task descriptions in the medical domain. Our proposed framework has two layers: a semantic analysis layer and a code generation layer. The semantic analysis layer consists of one detector that identifies ambiguity of the task description, and one resolver that ranks interpretations to ambiguous aspects of the query. The code generation layer is built on top of AgentFlow, where a planner agent coordinates three specialized tools: a medical knowledge base query executor, a DuckDB query executor, and an LLM-based UDF validator to iteratively generate, register, and verify DuckDB SQL macro functions and Python UDFs. Once the verifier agent decides that the task has been completed, a generator agent will generate the complete SQL code with UDF invocations.

    We evaluate the system on ten medical query scenarios using the MedAgentBench dataset, including glucose classification, potassium risk, chronic kidney disease staging, HbA1C classification, creatinine elevation, temporal recency, multi-factor diabetes risk scoring, glucose trend detection, creatinine streak analysis, and potassium volatility assessment. Our framework correctly handles all 57 test cases with 100\% accuracy, compared to 49\% accuracy achieved by DIN-SQL, a state-of-the-art NL-to-SQL baseline, demonstrating that structured tool orchestration with verification loops substantially improves generation quality.
