      title={The Data Management Crisis Behind AI-Based Brain MRI Diagnosis: Heterogeneity, Governance, and Reproducibility},
      author={Debnath, Tanmoy and Narbutt, Miroslaw and Kazimierczak, Katarzyna Anna},
      booktitle={VLDB 2026 Workshop: Biomedical Data Management Systems (BioDMS)},
      year={2026},
      publisher={VLDB Endowment}
