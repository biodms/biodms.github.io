  abstract: |
    Mediverse aims to bridge clinical and medical research and combine medical knowledge into a single graph that can be used to perform deep exploration and predictions across diverse modalities (e.g., genomic, clinical studies, medical, etc.). In particular, Mediverse intends to establish trust in medical data systems and exploit the benefits of graph representation learning methods, which are capable of addressing multiple key challenges that harm digitalisation in healthcare and medicine sectors today, namely: multi-modal data integration across clinics, complex search, and uncertainty-aware predictive computing.
